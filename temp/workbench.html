<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharePoint Framework Workbench</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/es6-shim/0.35.3/es6-shim.min.js"></script>
    <link rel="stylesheet" href="https://static2.sharepointonline.com/files/fabric/office-ui-fabric-core/11.0.0/css/fabric.min.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", "Segoe UI Web (West European)", "Segoe UI", -apple-system, BlinkMacSystemFont, "Roboto", "Helvetica Neue", sans-serif;
        }
        #workbenchPageContent {
            max-width: 100%;
            margin: 0 auto;
        }
        #spPageTitle {
            display: none;
        }
        .CanvasSection {
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="workbenchPageContent" class="CanvasSection">
        <div id="workbench"></div>
    </div>
    
    <script type="text/javascript">
        // Provide a minimal AMD define shim for manifests.js
        var define = function(deps, factory) {
            if (typeof deps === 'function') {
                factory = deps;
                deps = [];
            }
            if (factory) {
                var module = factory();
                if (window.debugManifests) {
                    // Module already set up by manifests.js
                }
            }
        };
        define.amd = true;
    </script>
    
    <script type="text/javascript" src="/temp/manifests.js"></script>
    
    <script type="text/javascript">
        // After manifests.js loads, check if debugManifests is available
        if (typeof window.debugManifests !== 'undefined' && window.debugManifests.getManifests) {
            console.log('Manifests loaded successfully');
        } else {
            console.error('Manifests failed to load properly');
        }
    </script>
</body>
</html>
